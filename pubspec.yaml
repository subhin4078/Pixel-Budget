name: pixel_budget
description: 像素記帳 / Pixel Budget — Offline-first pixel-art personal ledger & travel bill-splitting Flutter app.
publish_to: none
repository: https://github.com/subhin4078/Pixel-Budget
issue_tracker: https://github.com/subhin4078/Pixel-Budget/issues
version: 1.1.0+2
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.0
  sqflite: ^2.4.2
  path: ^1.9.1
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/foregrounds/
    - assets/icons/
    - assets/fonts/JfOpenHuninn-OFL.txt
    - assets/fonts/Fredoka-OFL.txt
  fonts:
    - family: JfOpenHuninn
      fonts:
        - asset: assets/fonts/JfOpenHuninn.ttf
          weight: 400
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
